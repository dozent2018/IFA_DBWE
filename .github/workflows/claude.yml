name: Claude

# Claude bearbeitet Issues und PRs:
# - Issue mit Label "claude" versehen (auch beim Erstellen)
# - "@claude" im Titel oder Text eines neuen Issues
# - "@claude" in einem Kommentar zu Issue oder PR
# Nur Personen mit Schreibrechten am Repo koennen Claude ausloesen (Default der Action).

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
      (github.event_name == 'issues' && github.event.action == 'opened' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Genau eines der beiden Secrets setzen (Settings > Secrets and variables > Actions):
          # ANTHROPIC_API_KEY (API-Key) oder CLAUDE_CODE_OAUTH_TOKEN (Pro/Max, via `claude setup-token`).
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(python3:*),Bash(pip install:*),Bash(sudo systemctl start mysql.service),Bash(mysql:*)"
